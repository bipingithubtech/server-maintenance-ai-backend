# Security Policies Configuration

deny_list:
  - "rm -rf /"
  - "rm -rf /*"
  - "mkfs"
  - "reboot"
  - "shutdown"
  - "chmod 777"
  - "chmod -R 777"
  - "chown -R root:root /"
  # Block interactive passwd (but NOT chpasswd which reads from stdin)
  - " passwd "          # standalone passwd command with spaces
  - " passwd\n"         # passwd at end of line
  - "|passwd"           # piped to passwd

allow_list:
  - "apt-get"
  - "systemctl"
  - "docker"
  - "ufw"
  - "tail"
  - "journalctl"
  - "cat"
  - "ls"
  - "echo"
  - "curl"
  - "chmod"
  - "chown"
  - "mkdir"
  - "useradd"
  - "userdel"
  - "usermod"
  - "adduser"
  - "chpasswd"
  - "top"
  - "free"
  - "df"
  - "ssh-keygen"
  - "sed"
  - "nginx"
  - "dpkg"
  - "test"
