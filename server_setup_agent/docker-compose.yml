# ════════════════════════════════════════════════════════════════
# Load environment variables from .env file
# Docker Compose automatically loads .env in the same directory
# Override specific vars: docker-compose --env-file .env.production up -d
# ════════════════════════════════════════════════════════════════

services:
  # ════════════════════════════════════════════════════════════════
  # FastAPI Application
  # ════════════════════════════════════════════════════════════════
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smai-app
    env_file:
      - .env
    environment:
      # FastAPI/Uvicorn
      PYTHONUNBUFFERED: "1"
      
      # LLM Configuration (from .env)
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY}
      MODEL_NAME: ${MODEL_NAME}
      TEMPERATURE: ${TEMPERATURE:-0.0}
      
      # GitHub (from .env)
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      
      # SSH Configuration (from .env)
      SSH_HOST: ${SSH_HOST}
      SSH_PORT: ${SSH_PORT:-22}
      SSH_USERNAME: ${SSH_USERNAME}
      SSH_KEY_PATH: ${SSH_KEY_PATH}
      
      # Teams Webhook (from .env)
      TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL}
    
    ports:
      - "8000:8000"
    
    volumes:
      # Mount config and log directories
      - ./logs:/app/logs
      - ./configs:/app/configs
      # Mount user's entire .ssh directory (works for any user)
      # The ~ expands to the current user's home directory automatically
      - ~/.ssh:/home/appuser/.ssh:ro
    
    networks:
      - smai_network
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3

# ════════════════════════════════════════════════════════════════
# Networks
# ════════════════════════════════════════════════════════════════
networks:
  smai_network:
    driver: bridge
